worker_processes auto;
worker_rlimit_nofile 20000;

events {
  worker_connections 8192;
}

http {
  access_log off;

  upstream api {
    server api:3000;
    keepalive 256;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }
  }
}
