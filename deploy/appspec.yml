version: 0.0
os: linux
files:
  - source: /
    destination: /opt/poc-bank/deploy
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 600
  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
